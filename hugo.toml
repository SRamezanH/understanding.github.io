languageCode = 'fa-IR'
defaultContentLanguage = 'fa'
title = 'فهمیدن'
enableRobotsTXT = true

[params]
  description = 'تلاشی برای فهمیدن و نوشتن'
  author = 'SRamezanH'

[languages]
