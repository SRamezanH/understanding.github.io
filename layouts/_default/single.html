{{ define "main" }}
  <article class="post">
    <header>
      <h1>{{ .Title }}</h1>
      <p class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        {{ with .Params.tags }}
          · {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
        {{ end }}
      </p>
    </header>
    {{ .Content }}
  </article>
{{ end }}
